<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MediCare HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-brand text-center mb-4">
      <a href="index.html" class="text-decoration-none">
        <span class="brand-mark">M+</span>
        <span class="fw-bold text-dark ms-2">MediCare HMS</span>
      </a>
    </div>

    <div class="card login-card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h2 class="fw-bold">Welcome back</h2>
        <p class="text-secondary mb-4">Sign in to access your hospital dashboard.</p>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control form-control-lg" id="username" required>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100">Sign In</button>
        </form>

       <div id="loginMessage" class="alert alert-info mt-3 d-none"></div>
      </div>
    </div>

   <p class="text-center text-secondary small mt-4">
  Academic project · Secure hospital management system
</p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
